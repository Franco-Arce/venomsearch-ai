[project]
name = "venomsearch-ai"
version = "0.1.0"
description = "ETL Pipeline & Vector Search for Neurotoxins using ESM-2 protein language model embeddings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Francisco" }]
keywords = [
    "bioinformatics",
    "neurotoxins",
    "protein-embeddings",
    "esm2",
    "vector-search",
    "etl",
    "lancedb",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "polars>=1.0.0",
    "pydantic>=2.0",
    "torch>=2.0",
    "transformers>=4.30",
    "lancedb>=0.6",
    "pyarrow>=14.0",
    "requests>=2.31",
    "rich>=13.0",
    "typer>=0.12",
    "numpy>=1.24",
    "streamlit>=1.62.0",
    "plotly>=6.9.0",
    "umap-learn>=0.5.12",
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests>=2.31",
    "responses>=0.25",
]
notebook = [
    "umap-learn>=0.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "jupyterlab>=4.0",
    "scikit-learn>=1.4",
    "nbformat>=5.9",
]

[project.scripts]
venomsearch = "venomsearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venomsearch"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["venomsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external APIs",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "lancedb.*", "umap.*"]
ignore_missing_imports = true
